[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "snakey"
version = "2.0.0"
description = "A simple snake game written in Python."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["snake", "pygame", "game"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment :: Arcade",
]
authors = [{ name = "Jost Prevc", email = "jost.prevc@gmail.com" }]
dependencies = ["pygame>=2.6.0"]

[dependency-groups]
dev = [
    "pytest>=7",
    "pre-commit",
    "mypy",
    "ruff",
]

[project.scripts]
snakey = "snakey.__main__:main"

[project.urls]
Homepage = "https://github.com/jprevc/snakey"
Repository = "https://github.com/jprevc/snakey"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"snakey.res" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
